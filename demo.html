<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>Cathay Pacific — AI-Native SDLC Demo</title>
<style>
  :root {
    --header: #6B0F1A;
    --agent: #B8972A;
    --panel: #F5EDD6;
    --human: #FDF6E3;
    --obs: #7A3B1E;
    --esc: #C0601A;
    --epic: #e879a0;
    --story: #D4A843;
    --release: #B8972A;
    --crq: #e8d9b0;
    --qa: #3a1a1a;
    --text: #1c0a0a;
    --muted: #7a5a5a;
    --border: #d9c9a9;
    --bg: #faf6ee;
    --ok: #2e8540;
    --warn: #c07f1a;
    --err: #b92e2e;
    --gold: #C4922A;
    --deep-red: #6B0F1A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; color: var(--text); background: var(--bg);
  }
  button { font-family: inherit; font-size: 14px; cursor: pointer; }
  .app {
    display: grid; grid-template-rows: auto auto auto auto 1fr auto;
    height: 100vh; min-width: 1440px;
  }

  /* Brand bar (Row 1) */
  .brandbar {
    background: var(--header); color: white; padding: 0 16px;
    min-height: 56px;
    display: flex; align-items: center; gap: 12px;
  }
  .brandbar .spacer { flex: 1; }
  .brandbar .persona-section {
    display: flex; align-items: center; gap: 10px;
  }
  .brandbar label { font-size: 14px; opacity: 0.95; color: white; }
  .brandbar select {
    background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 8px; border-radius: 4px; font-size: 14px;
  }
  .brandbar select option { color: black; }

  /* Controls bar (Row 2) */
  .controlsbar {
    background: #4a0a12; color: white; padding: 0 16px;
    min-height: 44px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .controlsbar .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.22); margin: 0 4px; }
  .controlsbar button {
    background: rgba(255,255,255,0.10); color: white; border: 1px solid rgba(255,255,255,0.20);
    padding: 5px 12px; border-radius: 4px; font-size: 13px;
  }
  .controlsbar button:hover { background: rgba(255,255,255,0.20); }
  .controlsbar button.active { background: var(--gold); color: white; border-color: var(--gold); }
  .controlsbar select {
    background: rgba(255,255,255,0.10); color: white; border: 1px solid rgba(255,255,255,0.20);
    padding: 4px 8px; border-radius: 4px; font-size: 13px;
  }
  .controlsbar select option { color: black; }
  .controlsbar label { font-size: 13px; opacity: 0.9; }
  .toggle-group { display: flex; align-items: center; gap: 6px; padding: 3px 8px; background: rgba(255,255,255,0.08); border-radius: 4px; }
  .toggle-group span { font-size: 12px; }
  .toggle {
    display: inline-block; width: 30px; height: 16px; background: rgba(255,255,255,0.25);
    border-radius: 8px; position: relative; cursor: pointer;
  }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    background: white; border-radius: 50%; transition: left 0.2s;
  }
  .toggle.on { background: var(--gold); }
  .toggle.on::after { left: 16px; }
  .persona-badge {
    display: inline-flex; align-items: center;
  }
  .cp-logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
    background: #3a2212; padding: 4px 10px; border-radius: 6px;
  }
  .cp-logo .cp-wordmark {
    display: flex; flex-direction: column; line-height: 1.15;
  }
  .cp-logo .cp-name { font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
  .cp-logo .cp-sub  { font-size: 9px; font-weight: 500; color: #C4922A; letter-spacing: 2px; text-transform: uppercase; }

  /* Narrator */
  .narrator {
    background: #FDF6E3; padding: 10px 20px; font-size: 15px;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
  }
  .narrator .step-num {
    background: #6B0F1A; color: white; padding: 3px 10px;
    border-radius: 12px; font-size: 13px; font-weight: 700;
  }
  .narrator #narratorText { font-style: italic; }

  /* Stage rail */
  .stage-rail {
    background: white; padding: 10px 20px;
    display: flex; align-items: center; gap: 6px; overflow-x: auto;
    border-bottom: 2px solid var(--gold);
  }
  .stage-chip {
    padding: 6px 12px; border-radius: 16px; background: #eef2f2;
    border: 1px solid var(--border); font-size: 13px; white-space: nowrap;
    display: flex; align-items: center; gap: 5px; position: relative;
  }
  .stage-chip.current {
    background: var(--gold); color: white; border-color: var(--gold); font-weight: 600;
    box-shadow: 0 2px 6px rgba(196, 146, 42, 0.4);
  }
  .stage-chip.done { background: #f0e8d0; color: #6B0F1A; }
  .stage-chip.gate::after { content: "\1F464"; margin-left: 2px; font-size: 12px; }
  .stage-chip.escalated { border: 2px solid var(--esc); }
  .stage-chip .arrow { color: var(--muted); }

  /* Main area */
  .main {
    display: grid; grid-template-columns: 1fr 320px;
    overflow: hidden; min-height: 0;
  }
  .main.drawer-collapsed { grid-template-columns: 1fr 32px; }
  .apps-container { padding: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .app-tabs {
    display: flex; gap: 4px; margin-bottom: 8px;
  }
  .app-tab {
    padding: 8px 14px; background: white; border: 1px solid var(--border);
    border-bottom: none; border-radius: 5px 5px 0 0; font-size: 14px;
  }
  .app-tab.active {
    background: var(--panel); font-weight: 700;
    border-bottom: 2px solid var(--gold);
  }
  .apps-view { flex: 1; overflow: hidden; min-height: 0; position: relative; }

  .grid-view { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; height: 100%; }
  .grid-view .panel { display: flex; flex-direction: column; }

  .panel {
    background: white; border: 1px solid var(--border); border-radius: 6px;
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-header {
    background: #6B0F1A; color: white; padding: 8px 12px; font-weight: 600; font-size: 14px;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { flex: 1; overflow: auto; min-height: 0; }

  /* Jira */
  .jira-board { display: flex; gap: 6px; padding: 8px; height: 100%; overflow-x: auto; }
  .jira-col {
    min-width: 130px; background: #f4f6f6; border: 1px solid var(--border); border-radius: 4px;
    display: flex; flex-direction: column; padding: 6px;
  }
  .jira-col-head { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 4px 2px; }
  .jira-card {
    background: white; border-radius: 4px; padding: 6px; margin-bottom: 4px;
    border-left: 3px solid var(--story); font-size: 12px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06); transition: background 0.3s, transform 0.3s;
  }
  .jira-card.epic { border-left-color: var(--epic); }
  .jira-card.release { border-left-color: var(--release); }
  .jira-card.crq { border-left-color: var(--crq); }
  .jira-card.qa { border-left-color: var(--qa); }
  .jira-card.flash { background: #fff8d5; box-shadow: 0 0 8px #ffcc00; }
  .jira-card .key { font-weight: 700; font-size: 11px; color: var(--muted); }
  .jira-card .attr { font-size: 10px; color: var(--muted); font-style: italic; margin-top: 3px; }
  .jira-card .risk {
    display: inline-block; padding: 1px 5px; border-radius: 8px;
    font-size: 10px; font-weight: 600; margin-top: 3px;
  }
  .risk.high { background: #fde0e0; color: var(--err); }
  .risk.med { background: #fdefd5; color: var(--warn); }
  .risk.low { background: #dbf0dc; color: var(--ok); }
  .jira-detail {
    position: absolute; top: 10px; right: 10px; bottom: 10px; width: 480px;
    background: white; border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15); z-index: 30; padding: 14px;
    overflow-y: auto; display: none;
  }
  .jira-detail.open { display: block; }
  .jira-detail h3 { margin: 0 0 6px 0; }
  .jira-detail .close {
    position: absolute; right: 10px; top: 10px; background: transparent; border: none;
    font-size: 18px; cursor: pointer; color: var(--muted);
  }
  .jira-detail h4 { margin: 12px 0 4px 0; font-size: 13px; color: var(--muted); text-transform: uppercase; }
  .jira-static-note {
    padding: 6px 8px; background: var(--human); border-left: 3px solid var(--obs);
    font-size: 12px; margin: 4px 8px; font-style: italic; color: #5a4a30;
  }

  /* Repo */
  .repo { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
  .repo-tabs { display: flex; background: #eef2f2; padding: 4px 8px 0 8px; gap: 3px; border-bottom: 1px solid var(--border); grid-column: 1 / span 2; }
  .repo-body { display: grid; grid-template-columns: 220px 1fr; grid-column: 1 / span 2; height: 100%; overflow: hidden; }
  .repo-tab { padding: 6px 12px; background: white; border: 1px solid var(--border); border-bottom: none; border-radius: 4px 4px 0 0; font-size: 13px; }
  .repo-tab.active { background: var(--panel); font-weight: 600; }
  .repo-tree {
    background: #fafcfc; border-right: 1px solid var(--border);
    padding: 8px; overflow-y: auto; font-size: 13px;
  }
  .repo-tree ul { list-style: none; padding-left: 12px; margin: 4px 0; }
  .repo-tree > ul { padding-left: 0; }
  .repo-tree .folder { font-weight: 600; color: var(--muted); margin-top: 6px; }
  .repo-tree .file { padding: 3px 4px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .repo-tree .file:hover { background: #eef2f2; }
  .repo-tree .file.active { background: var(--panel); font-weight: 600; }
  .repo-tree .file.missing { color: #bbb; font-style: italic; cursor: default; }
  .repo-tree .file.missing:hover { background: transparent; }
  .repo-tree .badge-new {
    background: var(--esc); color: white; font-size: 9px; padding: 1px 5px;
    border-radius: 6px; margin-left: 4px; font-weight: 700;
  }
  .repo-viewer { padding: 12px 16px; overflow-y: auto; font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .repo-viewer .frontmatter { color: var(--obs); background: #f7f4ee; padding: 6px; border-left: 3px solid var(--obs); margin-bottom: 8px; white-space: pre-wrap; }
  .repo-commits { padding: 12px; overflow-y: auto; }
  .commit-item { padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .commit-item .msg { font-weight: 600; }
  .commit-item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .repo-pr { padding: 14px; overflow-y: auto; }
  .pr-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .pr-check { display: flex; align-items: center; gap: 6px; padding: 5px 0; font-size: 13px; }
  .pr-check .icon { width: 16px; height: 16px; display: inline-block; text-align: center; font-weight: 700; }
  .pr-check .icon.ok { color: var(--ok); }
  .pr-check .icon.warn { color: var(--warn); }
  .pr-gate {
    background: var(--human); border-left: 3px solid var(--obs);
    padding: 8px; margin-top: 10px; font-size: 13px;
  }

  /* Monitoring */
  .mon-tabs { display: flex; background: #eef2f2; padding: 4px 8px 0 8px; gap: 3px; border-bottom: 1px solid var(--border); }
  .mon-tab { padding: 6px 12px; background: white; border: 1px solid var(--border); border-bottom: none; border-radius: 4px 4px 0 0; font-size: 13px; }
  .mon-tab.active { background: var(--panel); font-weight: 600; }
  .mon-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .mon-tagline {
    padding: 6px 12px; font-size: 12px; font-style: italic; color: var(--obs);
    background: #f7f4ee; border-bottom: 1px solid var(--border);
  }
  .mon-filters {
    padding: 6px 12px; display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .mon-filters select { padding: 3px 6px; border: 1px solid var(--border); border-radius: 3px; font-size: 13px; }
  .log-table {
    flex: 1; overflow-y: auto; font-family: "SF Mono", Monaco, monospace;
    font-size: 12px; padding: 0 4px;
  }
  .log-row {
    display: grid; grid-template-columns: 80px 90px 130px 90px 1fr 120px;
    gap: 6px; padding: 4px 8px; border-bottom: 1px solid #eef2f2;
  }
  .log-row.escalation { background: #fbe5d3; }
  .log-row.gate { background: var(--human); }
  .log-row.warn { background: #fdf6e3; }
  .log-header {
    display: grid; grid-template-columns: 80px 90px 130px 90px 1fr 120px;
    gap: 6px; padding: 5px 8px; background: #eef2f2; font-weight: 700;
    font-size: 11px; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .obs-panel { padding: 12px; overflow-y: auto; }
  .obs-section { margin-bottom: 16px; }
  .obs-section h4 { margin: 0 0 6px 0; font-size: 13px; color: var(--muted); text-transform: uppercase; }
  .chart-svg { width: 100%; height: auto; }
  .metric-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px;
  }
  .metric-label { width: 200px; }
  .metric-bar { flex: 1; height: 12px; background: #eef2f2; border-radius: 6px; overflow: hidden; }
  .metric-bar .fill { height: 100%; background: var(--agent); }
  .metric-val { width: 80px; text-align: right; font-family: monospace; }
  .evidence-item {
    background: white; border: 1px solid var(--border); border-radius: 4px;
    padding: 8px; margin-bottom: 8px; font-size: 13px;
  }
  .evidence-item.gate-approved { border-left: 4px solid var(--ok); }
  .evidence-item.gate-escalated { border-left: 4px solid var(--esc); }
  .evidence-item.gate-pending { border-left: 4px solid var(--muted); }
  .evidence-item h5 { margin: 0 0 4px 0; font-size: 13px; }
  .evidence-item .meta { color: var(--muted); font-size: 12px; }

  /* Agent Portal */
  .agent-portal { display: grid; grid-template-columns: 240px 1fr; height: 100%; overflow: hidden; }
  .agent-roster { background: #fafcfc; border-right: 1px solid var(--border); padding: 8px; overflow-y: auto; }
  .agent-harness {
    border: 2px dashed var(--agent); border-radius: 6px; padding: 6px;
    margin-bottom: 8px; position: relative;
  }
  .agent-harness::before {
    content: "Agent Harness"; position: absolute; top: -9px; left: 8px;
    background: #fafcfc; padding: 0 6px; font-size: 11px; color: var(--agent); font-weight: 700;
  }
  .agent-item {
    padding: 6px 8px; border-radius: 4px; margin-bottom: 3px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; font-size: 13px;
    background: white; border: 1px solid var(--border);
  }
  .agent-item:hover { background: var(--panel); }
  .agent-item.active { background: var(--panel); border-color: var(--agent); font-weight: 600; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px;
  }
  .status-idle { background: #bbb; }
  .status-running { background: var(--ok); animation: pulse 1s infinite; }
  .status-waiting { background: var(--esc); animation: pulse 1.4s infinite; }
  .status-done { background: #4a7ba0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .agent-trace {
    padding: 10px 16px; overflow-y: auto; background: #fafcfc;
  }
  .trace-block {
    background: white; border-radius: 6px; padding: 8px 10px;
    margin-bottom: 8px; border-left: 3px solid var(--agent); font-size: 13px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .trace-block.thinking { border-left-color: #8a7fb8; }
  .trace-block.tool-call { border-left-color: #d4a017; }
  .trace-block.tool-result { border-left-color: #4a7ba0; }
  .trace-block.artefact { border-left-color: var(--ok); }
  .trace-block.handover { border-left-color: var(--esc); background: var(--human); }
  .trace-header {
    display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 4px;
    cursor: pointer;
  }
  .trace-body { font-size: 13px; color: #354045; }
  .trace-body.json {
    font-family: monospace; background: #f7f9fa; padding: 6px; border-radius: 3px;
    white-space: pre-wrap; font-size: 12px; margin-top: 4px;
  }
  .trace-body.collapsed { display: none; }
  .footnote { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 4px; }

  /* Right drawer */
  .drawer {
    background: white; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .drawer-toggle {
    background: #6B0F1A; color: white; border: none; padding: 8px 0;
    writing-mode: vertical-rl; text-orientation: mixed; cursor: pointer;
    font-size: 12px; letter-spacing: 1px;
  }
  .drawer.collapsed { align-items: center; }
  .drawer.collapsed .drawer-content { display: none; }
  .drawer-content { padding: 0; overflow-y: auto; flex: 1; }
  .drawer-content > * { margin-left: 12px; margin-right: 12px; }
  .drawer-content > h3:first-child {
    margin: 0 0 12px 0; padding: 10px 12px;
    background: #6B0F1A; color: white; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .drawer h3 {
    margin: 12px 0 8px 0; font-size: 14px; color: #6B0F1A;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .risk-tier {
    padding: 10px; border-radius: 6px; margin-bottom: 12px;
    text-align: center; font-weight: 700; font-size: 16px;
  }
  .risk-tier.high { background: #6B0F1A; color: white; border: 1px solid #6B0F1A; }
  .risk-tier.med { background: #C4922A; color: white; border: 1px solid #C4922A; }
  .risk-tier.low { background: #2e8540; color: white; border: 1px solid #2e8540; }
  .risk-tier.pending { background: #eef2f2; color: var(--muted); border: 1px solid var(--border); }
  .drawer ul { padding-left: 16px; margin: 6px 0; font-size: 13px; }
  .drawer .gate-item {
    background: #f7f4ee; padding: 6px 8px; border-left: 3px solid var(--obs);
    margin-bottom: 4px; font-size: 12px;
  }

  /* Footer */
  .footer {
    background: #1a3538; color: rgba(255,255,255,0.75); padding: 6px 20px;
    font-size: 12px; text-align: center; letter-spacing: 0.5px;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: white; border-radius: 8px; width: 560px; max-width: 90vw;
    max-height: 80vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .modal-header {
    background: var(--human); padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h3 { margin: 0; font-size: 16px; color: var(--obs); }
  .modal-body { padding: 16px 18px; font-size: 13px; }
  .modal-body h4 { margin: 10px 0 4px 0; font-size: 13px; color: var(--muted); text-transform: uppercase; }
  .modal-footer {
    padding: 12px 18px; display: flex; justify-content: flex-end; gap: 8px;
    border-top: 1px solid var(--border); background: #fafcfc;
  }
  .modal-footer button {
    padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border);
    background: white; font-weight: 600;
  }
  .modal-footer button.approve { background: var(--ok); color: white; border-color: var(--ok); }
  .modal-footer button.change { background: var(--warn); color: white; border-color: var(--warn); }
  .modal-footer button.escalate { background: var(--esc); color: white; border-color: var(--esc); }
  .modal-footer button.disabled { opacity: 0.4; cursor: not-allowed; }
  .persona-mismatch {
    background: #fde0e0; padding: 8px; border-radius: 4px; margin-bottom: 10px;
    color: var(--err); font-weight: 600; font-size: 13px;
  }
  .persona-tag {
    display: inline-flex; align-items: center;
  }
  .evidence-list { background: #fafcfc; padding: 8px; border-radius: 4px; margin-top: 6px; font-size: 13px; }

  /* Requirement Intake Portal */
  .blank-field { background: #f9f9f9 !important; border-color: #e8e8e8 !important; color: transparent !important; min-height: 36px; }
  .code-blank { font-family: monospace; }
  .intake-portal { transition: opacity 0.4s ease; }
  .intake-portal.intake-submitted-state { }
  .intake-card { transition: box-shadow 0.4s ease; }
  .intake-card.intake-card-done { box-shadow: 0 4px 24px rgba(46,133,64,0.18); }
  .intake-slide-out { animation: slideOutUp 0.5s ease forwards; }
  @keyframes slideOutUp {
    0%   { opacity:1; transform: translateY(0); }
    100% { opacity:0; transform: translateY(-40px); }
  }

  .intake-portal {
    display: flex; align-items: flex-start; justify-content: center;
    padding: 32px 24px; height: 100%; overflow-y: auto; background: var(--bg);
  }
  .intake-card {
    background: white; border-radius: 10px; box-shadow: 0 4px 24px rgba(107,15,26,0.10);
    width: 100%; max-width: 860px; overflow: hidden;
  }
  .intake-card-header {
    background: var(--header); color: white; padding: 20px 28px;
    display: flex; align-items: center; gap: 16px;
  }
  .intake-card-header .intake-icon {
    background: rgba(255,255,255,0.15); border-radius: 8px; padding: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .intake-card-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .intake-card-header p  { margin: 4px 0 0; font-size: 13px; opacity: 0.8; }
  .intake-body { padding: 28px; }
  .intake-section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--header); margin: 0 0 14px; padding-bottom: 6px;
    border-bottom: 2px solid var(--gold);
  }
  .intake-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; margin-bottom: 24px; }
  .intake-grid.wide { grid-template-columns: 1fr; }
  .intake-field label {
    display: block; font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px;
  }
  .intake-field .field-value {
    background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 9px 12px; font-size: 14px; color: var(--text);
  }
  .intake-field .field-value.highlight {
    background: #fff8e6; border-color: var(--gold); font-weight: 600; color: var(--header);
  }
  .intake-field .field-value.code {
    font-family: monospace; font-size: 13px; background: #fdf6ee; border-color: var(--gold);
    color: var(--header); font-weight: 700;
  }
  .intake-field textarea.field-value {
    width: 100%; resize: none; height: 72px; font-family: inherit;
  }
  .intake-badge-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .intake-badge {
    padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600;
    background: var(--panel); color: var(--header); border: 1px solid var(--border);
  }
  .intake-badge.priority-high { background: #fde0e0; color: var(--err); border-color: var(--err); }
  .intake-badge.priority-med  { background: #fdefd5; color: var(--warn); border-color: var(--warn); }
  .intake-submit-row { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--border); }
  .intake-submit-btn {
    background: var(--header); color: white; border: none; padding: 11px 28px;
    border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .intake-submit-btn:hover { background: #8a1224; }
  .intake-submitted-banner {
    background: #e8f5e9; border: 1px solid #4caf50; color: #1b5e20;
    border-radius: 6px; padding: 12px 18px; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .intake-epic-pill {
    display: inline-flex; align-items: center; gap: 6px; background: #fde8f0;
    border: 1px solid var(--epic); border-radius: 12px; padding: 4px 12px;
    font-size: 13px; font-weight: 700; color: #8b1a4a;
  }

  /* Summary screen */
  .summary-view {
    padding: 30px; background: white; border-radius: 8px; margin: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  .summary-view h2 { color: var(--header); margin: 0 0 16px 0; }
  .summary-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .metric-card {
    background: var(--panel); padding: 14px; border-radius: 6px; text-align: center;
  }
  .metric-card .val { font-size: 24px; font-weight: 700; color: var(--header); }
  .metric-card .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
  .evidence-chain { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0 20px 0; }
  .chain-node {
    background: var(--panel); border: 1px solid var(--agent); padding: 8px 12px;
    border-radius: 6px; font-size: 12px; min-width: 160px;
  }
  .chain-node .name { font-weight: 700; }
  .chain-node .approver { color: var(--muted); font-size: 11px; }
  .chain-node .hash { color: var(--muted); font-family: monospace; font-size: 10px; }
  .chain-arrow { font-size: 22px; color: var(--agent); }
  .summary-btn {
    background: var(--header); color: white; padding: 10px 20px; border-radius: 5px;
    border: none; font-weight: 600; margin-right: 10px;
  }

  .illustrative-badge {
    display: inline-block; background: #fdefd5; color: var(--warn); padding: 2px 8px;
    border-radius: 10px; font-size: 11px; font-weight: 700; margin-left: 6px;
  }
</style>
</head>

const LoyaltyGateway = require('./gateways/LoyaltyGateway');
const PaymentTokeniser = require('./PaymentTokeniser');

async function submitBid({ memberId, flightId, milesAmount, cashAmount, currency }) {
  const balance = await LoyaltyGateway.getBalance(memberId);
  if (balance < milesAmount) throw new Error('INSUFFICIENT_MILES');
  const token = await PaymentTokeniser.tokenise({ amount: cashAmount, currency });
  const bid = await createBidRecord({ memberId, flightId, milesAmount, token });
  await LoyaltyGateway.holdMiles(memberId, milesAmount, bid.id);
  return bid;
}

module.exports = { submitBid };

// ============================================================================
// INITIALISATION
// ============================================================================
function initState() {
  STATE.step = 0;
  STATE.intakeFilled = false;
  STATE.logs = [];
  STATE.commits = [];
  STATE.risk = { tier: null, reasons: ['Awaiting Plan & Analyse'], gates: [] };
  STATE.currentGate = null;
  STATE.showingSummary = false;
  STATE.stageEscalations = {};
  STATE.fdeRevision = 0;

  STATE.jira = {
    'CX-EPIC-214': { type:'epic', key:'CX-EPIC-214', title:'Ancillary Revenue: Upgrade Bid', status:null, attribution:'', flash:false, risk:null },
    'CX-1287':     { type:'story', key:'CX-1287', title:'Upgrade Bid — Manage Booking', status:null, attribution:'', flash:false, risk:null, labels:[], epic:'CX-EPIC-214' },
    'MB-2026.10.2':{ type:'release', key:'MB-2026.10.2', title:'Manage Booking Release', status:null, attribution:'', flash:false },
    'CHG0045921':  { type:'crq', key:'CHG0045921', title:'CRQ: Upgrade Bid Deploy', status:null, attribution:'', flash:false },
    'QA-3391':     { type:'qa', key:'QA-3391', title:'Sandbox Verification', status:null, attribution:'', flash:false }
  };

  STATE.files = {};
  for (const [k,v] of Object.entries(ARTEFACTS)) {
    if (k.endsWith('.js')) STATE.files[k] = { present: false, content: v, isNew: false };
    else if (k === 'Spec.md.v2') continue;
    else STATE.files[k] = { present: false, content: v, isNew: false, revision: 0 };
  }

  STATE.agents = {};
  AGENTS.forEach(a => STATE.agents[a] = 'idle');
  STATE.traces = {};
  AGENTS.forEach(a => STATE.traces[a] = []);
  STATE.activeAgent = 'Frame Agent';
}

// ============================================================================
// HELPERS: state mutation
// ============================================================================
function writeArtefact(name, altKey) {
  const content = altKey ? ARTEFACTS[altKey] : ARTEFACTS[name];
  if (!STATE.files[name]) STATE.files[name] = { present: true, content, isNew: true };
  else {
    STATE.files[name].present = true;
    STATE.files[name].isNew = true;
    STATE.files[name].content = content;
    if (altKey) STATE.files[name].revision = (STATE.files[name].revision || 0) + 1;
  }
}

function addLog(entry) {
  const now = new Date();
  const ts = now.toISOString().substr(11, 8);
  const trace = 'trc-' + (STATE.logs.length + 100).toString(16);
  STATE.logs.push({ ts, ...entry, trace });
}

function setAgentStatus(agent, status) {
  STATE.agents[agent] = status;
}

function addTrace(agent, kind, payload, extras) {
  if (!STATE.traces[agent]) STATE.traces[agent] = [];
  STATE.traces[agent].push({ kind, payload, extras: extras || {}, ts: new Date().toISOString().substr(11,8) });
}

// ============================================================================
// TIMELINE EXECUTION
// ============================================================================
function currentStepDef() {
  if (STATE.step === 0) return null;
  return TIMELINE[STATE.step - 1];
}

function stepHasGate() {
  const def = currentStepDef();
  return def && def.gate;
}

function advanceStep() {
  if (STATE.step >= STATE.maxStep) return;
  clearFlashes();
  STATE.step += 1;
  const def = TIMELINE[STATE.step - 1];
  if (def) {
    STATE.activeApp = def.app || STATE.activeApp;
    if (def.gate) {
      // Execute exec if present will be blocked till approval
      openGate(def);
    } else {
      def.exec(STATE);
    }
  }
  renderAll();
}

function clearFlashes() {
  Object.values(STATE.jira).forEach(c => c.flash = false);
  Object.values(STATE.files).forEach(f => { if (f) f.isNew = false; });
}


function resetAll() {
  initState();
  closeModal();
  renderAll();
}

// ============================================================================
// GATE HANDLING
// ============================================================================
function openGate(def) {
  STATE.currentGate = def;
  pause();
  renderModal();
}

function closeModal() {
  STATE.currentGate = null;
  const backdrop = document.getElementById('modalBackdrop');
  if (backdrop) backdrop.classList.add('hidden');
}

function approveGate() {
  const def = STATE.currentGate;
  if (!def) return;
  if (def.exec) def.exec(STATE);
  closeModal();
  renderAll();
}

function requestChanges() {
  const def = STATE.currentGate;
  if (!def) return;
  if (def.execReject) def.execReject(STATE);
  else if (def.exec) def.exec(STATE);
  addLog({stage:def.stage,actor:def.gate.persona,type:'GATE',msg:'Changes requested at gate'});
  closeModal();
  renderAll();
}

function escalate() {
  const def = STATE.currentGate;
  if (!def) return;
  addLog({stage:def.stage,actor:def.gate.persona,type:'ESCALATION',msg:'Gate escalated by human'});
  STATE.stageEscalations[def.stage] = true;
  if (def.exec) def.exec(STATE);
  closeModal();
  renderAll();
}

function renderModal() {
  const def = STATE.currentGate;
  const backdrop = document.getElementById('modalBackdrop');
  if (!def || !def.gate) { backdrop.classList.add('hidden'); return; }
  backdrop.classList.remove('hidden');
  const g = def.gate;
  document.getElementById('modalTitle').textContent = g.title;
  document.getElementById('modalPersona').innerHTML = personaBadgeHTML(g.persona, 'lg');

  const personaOK = STATE.persona === g.persona || STATE.persona.startsWith(g.persona.split(' (')[0]);
  const isObserver = STATE.persona === 'CTO (Observer)';
  const canAct = personaOK && !isObserver;

  const evidenceHtml = g.evidence.map(e => '<li>' + escapeHtml(e) + '</li>').join('');
  let mismatch = '';
  if (!canAct) {
    const short = PERSONA_SHORT[g.persona] || g.persona;
    mismatch = '<div class="persona-mismatch">Switch to '+personaBadgeHTML(g.persona)+' to act on this gate.</div>';
  }
  document.getElementById('modalBody').innerHTML =
    mismatch +
    '<h4>What to Review</h4><div>'+escapeHtml(g.what)+'</div>' +
    '<h4>Evidence</h4><div class="evidence-list"><ul>'+evidenceHtml+'</ul></div>' +
    '<h4>Gate Rationale</h4><div style="font-style:italic;color:#5a4a30;">'+escapeHtml(g.rationale)+'</div>';

  const disabledCls = canAct ? '' : ' disabled';
  document.getElementById('modalFooter').innerHTML =
    '<button onclick="closeModal()">Cancel</button>' +
    '<button class="change'+disabledCls+'" onclick="if(!this.classList.contains(\'disabled\'))requestChanges()">Request Changes</button>' +
    '<button class="escalate'+disabledCls+'" onclick="if(!this.classList.contains(\'disabled\'))escalate()">Escalate</button>' +
    '<button class="approve'+disabledCls+'" onclick="if(!this.classList.contains(\'disabled\'))approveGate()">Approve</button>';
}

// ============================================================================
// RENDERING
// ============================================================================
function renderAll() {
  renderTopBar();
  renderNarrator();
  renderStageRail();
  renderDrawer();
  renderAppsView();
  renderModal();
}

function renderTopBar() {
  document.getElementById('personaBadge').innerHTML = personaBadgeHTML(STATE.persona);
  document.getElementById('tgTestFail').classList.toggle('on', STATE.toggles.testFail);
  document.getElementById('tgLowRisk').classList.toggle('on', STATE.toggles.lowRisk);
  document.getElementById('tgReject').classList.toggle('on', STATE.toggles.reject);
  document.getElementById('tgSynth').classList.toggle('on', STATE.toggles.synth);
  document.getElementById('btnFocus').classList.toggle('active', STATE.viewMode === 'focus');
  document.getElementById('btnGrid').classList.toggle('active', STATE.viewMode === 'grid');
}

function renderNarrator() {
  const el = document.getElementById('narratorText');
  const numEl = document.getElementById('stepNum');
  numEl.textContent = STATE.step + ' / ' + STATE.maxStep;
  if (STATE.step === 0) el.textContent = 'Ready. Press Next Step to begin.';
  else if (STATE.showingSummary) el.textContent = 'Complete. See summary in Agent Portal.';
  else {
    const def = TIMELINE[STATE.step - 1];
    el.textContent = def ? def.narration : '';
  }
}

function renderStageRail() {
  const el = document.getElementById('stageRail');
  const currentStage = STATE.step === 0 ? 'Business Objective' : TIMELINE[STATE.step - 1].stage;
  const doneStages = new Set();
  for (let i = 0; i < STATE.step; i++) doneStages.add(TIMELINE[i].stage);
  const gateStages = new Set(TIMELINE.filter(t => t.gate).map(t => t.stage));

  let html = '';
  STAGES.forEach((stage, i) => {
    const isCurrent = stage === currentStage && !STATE.showingSummary;
    const isDone = doneStages.has(stage) && !isCurrent;
    const isGate = gateStages.has(stage);
    const isEsc = STATE.stageEscalations[stage];
    const cls = ['stage-chip'];
    if (isCurrent) cls.push('current');
    else if (isDone) cls.push('done');
    if (isGate) cls.push('gate');
    if (isEsc) cls.push('escalated');
    const check = isDone ? '✓ ' : '';
    html += '<div class="' + cls.join(' ') + '">' + check + escapeHtml(stage) + '</div>';
    if (i < STAGES.length - 1) html += '<span class="arrow">→</span>';
  });
  el.innerHTML = html;
}

function renderDrawer() {
  const tierEl = document.getElementById('riskTier');
  const reasonsEl = document.getElementById('riskReasons');
  const gatesEl = document.getElementById('gatesList');
  const t = STATE.risk.tier;
  if (!t) {
    tierEl.className = 'risk-tier pending';
    tierEl.textContent = 'RISK: PENDING';
  } else {
    tierEl.className = 'risk-tier ' + t;
    tierEl.textContent = 'RISK: ' + t.toUpperCase();
  }
  reasonsEl.innerHTML = STATE.risk.reasons.map(r => '<li>' + escapeHtml(r) + '</li>').join('');
  if (!STATE.risk.gates.length) {
    gatesEl.innerHTML = '<div class="gate-item">None yet</div>';
  } else {
    gatesEl.innerHTML = STATE.risk.gates.map(g => '<div class="gate-item">' + escapeHtml(g) + '</div>').join('');
  }
}

  const f = (val, cls='') => filled
    ? `<div class="field-value ${cls}">${val}</div>`
    : `<div class="field-value blank-field">&nbsp;</div>`;
  const fc = (val) => filled
    ? `<div class="field-value code">${val}</div>`
    : `<div class="field-value blank-field code-blank">&nbsp;</div>`;
  const fta = (val) => filled
    ? `<div class="field-value" style="height:auto;padding:10px 12px;font-size:14px;line-height:1.6;">${val}</div>`

  return `
  <div class="intake-portal ${submitted ? 'intake-submitted-state' : ''}">
    <div class="intake-card ${submitted ? 'intake-card-done' : ''}" ${!filled && !submitted ? 'onclick="if(!STATE.intakeFilled&&STATE.step===0)handleIntakeFill()" style="cursor:pointer;"' : ''}>
      <div class="intake-card-header">

function renderAppsView() {
  const container = document.getElementById('appsView');
  const tabs = document.getElementById('appTabs');

  // Step 0 & 1: show Requirement Intake Portal, hide app tabs
  if (STATE.step <= 1 && !STATE.showingSummary) {
    tabs.style.display = 'none';
    container.innerHTML = renderIntakePortal();
    return;
  }

  tabs.style.display = STATE.viewMode === 'grid' ? 'none' : 'flex';
  Array.from(tabs.children).forEach(t => {
    t.classList.toggle('active', t.dataset.app === STATE.activeApp);
  });

  if (STATE.showingSummary) {
    container.innerHTML = renderSummary();
    return;
  }

  if (STATE.viewMode === 'grid') {
    container.innerHTML =
      '<div class="grid-view">' +
        '<div class="panel"><div class="panel-header">Jira</div><div class="panel-body" id="pane-jira"></div></div>' +
        '<div class="panel"><div class="panel-header">Repo</div><div class="panel-body" id="pane-repo"></div></div>' +
        '<div class="panel"><div class="panel-header">Monitoring &amp; Logging</div><div class="panel-body" id="pane-monitor"></div></div>' +
        '<div class="panel"><div class="panel-header">Agent Portal</div><div class="panel-body" id="pane-portal"></div></div>' +
      '</div>';
    document.getElementById('pane-jira').innerHTML = renderJira();
    document.getElementById('pane-repo').innerHTML = renderRepo();
    document.getElementById('pane-monitor').innerHTML = renderMonitor();
    document.getElementById('pane-portal').innerHTML = renderPortal();
    wireRepoEvents();
    wirePortalEvents();
    wireMonitorEvents();
    wireJiraEvents();
  } else {
    container.innerHTML = '<div class="panel" style="height:100%;"><div class="panel-body" id="pane-single"></div></div>';
    const pane = document.getElementById('pane-single');
    if (STATE.activeApp === 'jira') pane.innerHTML = renderJira();
    else if (STATE.activeApp === 'repo') pane.innerHTML = renderRepo();
    else if (STATE.activeApp === 'monitor') pane.innerHTML = renderMonitor();
    else if (STATE.activeApp === 'portal') pane.innerHTML = renderPortal();
    wireRepoEvents();
    wirePortalEvents();
    wireMonitorEvents();
    wireJiraEvents();
  }
}

let JIRA_DETAIL_KEY = null;
function renderJira() {
  const storyReleaseView = STATE.step < 15;
  const columns = storyReleaseView ? STORY_STATUSES : ['DONE'].concat(RELEASE_STATUSES).concat(CRQ_STATUSES).concat(QA_STATUSES).concat(EPIC_STATUSES);
  // For clarity, keep a single column list; column determined by status
  const allCols = STORY_STATUSES.concat(['FIX VERSION','RELEASED','SERVICENOW','CRQ APPROVAL','EXECUTING']);
  let html = '<div class="jira-board">';
  const colsToShow = storyReleaseView ? STORY_STATUSES : ['DONE','FIX VERSION','RELEASED','SERVICENOW','CRQ APPROVAL','EXECUTING','ACCEPTED'];
  colsToShow.forEach(col => {
    html += '<div class="jira-col"><div class="jira-col-head">' + escapeHtml(col) + '</div>';
    Object.values(STATE.jira).forEach(card => {
      if (card.status === col) {
        html += renderJiraCard(card);
      }
    });
    html += '</div>';
  });
  html += '</div>';
  if (!storyReleaseView) {
    html += '<div class="jira-static-note">No story status after Done — completed stories tracked via Jira Releases</div>';
  }
  if (JIRA_DETAIL_KEY && STATE.jira[JIRA_DETAIL_KEY]) {
    html += renderJiraDetail(STATE.jira[JIRA_DETAIL_KEY]);
  }
  return html;
}

function renderJiraCard(card) {
  const cls = ['jira-card', card.type, card.flash ? 'flash' : ''].join(' ');
  const riskBadge = card.risk ? '<div class="risk ' + card.risk + '">Risk: ' + card.risk.toUpperCase() + '</div>' : '';
  const attr = card.attribution ? '<div class="attr">' + escapeHtml(card.attribution) + '</div>' : '';
  return '<div class="' + cls + '" data-key="' + card.key + '">' +
    '<div class="key">' + escapeHtml(card.key) + '</div>' +
    '<div>' + escapeHtml(card.title) + '</div>' +
    riskBadge + attr +
    '</div>';
}

// REPO RENDERING
// ---------------------------------------------------------------------------
let REPO_TAB = 'files';
let REPO_FILE = null;
function renderRepo() {
  let html = '<div class="repo-tabs">' +
    ['files','commits','pr'].map(t => '<div class="repo-tab' + (REPO_TAB===t?' active':'') + '" data-rtab="'+t+'">' + (t==='pr' ? 'Pull Request' : t.charAt(0).toUpperCase()+t.slice(1)) + '</div>').join('') +
    '</div>';
  if (REPO_TAB === 'files') {
    html += '<div class="repo-body">';
    html += '<div class="repo-tree">' + renderRepoTree() + '</div>';
    html += '<div class="repo-viewer">' + renderRepoViewer() + '</div>';
    html += '</div>';
  } else if (REPO_TAB === 'commits') {
    html += '<div class="repo-commits">' + renderCommits() + '</div>';
  } else {
    html += '<div class="repo-pr">' + renderPR() + '</div>';
  }
  return html;
}

function renderRepoTree() {
  let html = '<ul>';
  FILE_TREE.forEach(group => {
    html += '<li class="folder">' + escapeHtml(group.folder) + '</li><ul>';
    group.files.forEach(f => {
      const file = STATE.files[f];
      const present = file && file.present;
      const isNew = file && file.isNew;
      const isActive = REPO_FILE === f;
      const cls = ['file', present ? '' : 'missing', isActive ? 'active' : ''].filter(Boolean).join(' ');
      html += '<li class="' + cls + '" data-file="' + f + '">' +
        (present ? '📄' : '·') + ' ' + escapeHtml(f) +
        (isNew ? '<span class="badge-new">NEW</span>' : '') +
        (file && file.revision ? '<span class="badge-new" style="background:var(--warn);">v'+(file.revision+1)+'</span>' : '') +
        '</li>';
    });
    html += '</ul>';
  });
  html += '</ul>';
  return html;
}

function renderRepoViewer() {
  if (!REPO_FILE) {
    // Auto-pick most recent artefact
    const present = Object.entries(STATE.files).filter(([k,v]) => v && v.present);
    if (!present.length) return '<div style="color:var(--muted);">Select a file to view.</div>';
    REPO_FILE = present[present.length - 1][0];
  }
  const f = STATE.files[REPO_FILE];
  if (!f || !f.present) return '<div style="color:var(--muted);">File not yet produced.</div>';
  const content = f.content;
  const parts = content.split(/^---\s*$/m);
  if (content.startsWith('---')) {
    return '<div class="frontmatter">' + escapeHtml(parts[1]) + '</div>' + escapeHtml(parts.slice(2).join('---'));
  }
  return escapeHtml(content);
}

function renderCommits() {
  if (!STATE.commits.length) return '<div style="color:var(--muted);">No commits yet.</div>';
  return STATE.commits.map(c =>
    '<div class="commit-item">' +
      '<div class="msg">' + escapeHtml(c.msg) + '</div>' +
      '<div class="meta">' + escapeHtml(c.sha) + ' · ' + escapeHtml(c.author) + ' · ' + escapeHtml(c.time) + ' · ' + escapeHtml(c.key) + '</div>' +
    '</div>'
  ).join('');
}

function renderPR() {
  const merged = STATE.step >= 14;
  const approved = STATE.step >= 13;
  return '<div class="pr-header">' +
    '<h3 style="margin:0;">PR #4471 — CX-1287: Upgrade Bid via Manage Booking</h3>' +
    (merged ? '<span style="background:var(--ok);color:white;padding:3px 10px;border-radius:10px;font-size:12px;">MERGED</span>' :
     approved ? '<span style="background:var(--warn);color:white;padding:3px 10px;border-radius:10px;font-size:12px;">APPROVED</span>' :
     '<span style="background:#eef2f2;padding:3px 10px;border-radius:10px;font-size:12px;">OPEN</span>') +
    '</div>' +
    '<div style="font-size:13px;color:var(--muted);margin-bottom:10px;">Coding Agent (Compose) → main · 3 files changed, 4 tests added</div>' +
    '<h4>Checks</h4>' +
    '<div class="pr-check"><span class="icon ok">✓</span> Unit tests (24/24)</div>' +
    '<div class="pr-check"><span class="icon ok">✓</span> SIT tests (8/8) ' + (STATE.toggles.testFail && STATE.step >= 10 ? '<span style="color:var(--muted);"> (1 retry)</span>' : '') + '</div>' +
    '<div class="pr-check"><span class="icon ok">✓</span> UAT tests (5/5)</div>' +
    '<div class="pr-check"><span class="icon ok">✓</span> Perf (p99 1.7s < 2s target)</div>' +
    '<div class="pr-check"><span class="icon ok">✓</span> TOAD / TAP quality gate</div>' +
    '<div class="pr-check"><span class="icon ok">✓</span> Coverage 87% (+4.2%)</div>' +
    '<div class="pr-gate"><strong>Human approval gates the merge.</strong> QA Lead (with PO for subjective ACs) must approve Testing_report.md before merge is authorised.</div>';
}

function wireRepoEvents() {
  document.querySelectorAll('[data-rtab]').forEach(el => {
    el.onclick = () => { REPO_TAB = el.dataset.rtab; renderAll(); };
  });
  document.querySelectorAll('.repo-tree .file').forEach(el => {
    el.onclick = () => {
      const name = el.dataset.file;
      const f = STATE.files[name];
      if (f && f.present) { REPO_FILE = name; renderAll(); }
    };
  });
}

// ---------------------------------------------------------------------------
let MON_TAB = 'logging';
let MON_FILTERS = { agent: 'all', stage: 'all', level: 'all' };
function renderMonitor() {
  let html = '<div class="mon-tagline">Agent / Stage → Standardized Logs → Centralized Repository</div>';
  html += '<div class="mon-tabs">' +
    ['observability','evidence','logging'].map(t =>
      '<div class="mon-tab' + (MON_TAB===t?' active':'') + '" data-mtab="'+t+'">' + t.charAt(0).toUpperCase()+t.slice(1) + '</div>'
    ).join('') + '</div>';
  html += '<div class="mon-body">';
  if (MON_TAB === 'logging') html += renderLogging();
  else if (MON_TAB === 'observability') html += renderObs();
  else html += renderEvidence();
  html += '</div>';
  return html;
}

function renderLogging() {
  const agents = ['all'].concat(Array.from(new Set(STATE.logs.map(l=>l.actor))));
  const stages = ['all'].concat(STAGES);
  const levels = ['all','INFO','WARN','ESCALATION','GATE'];
  let html = '<div class="mon-filters">' +
    'Agent: <select id="fltAgent">' + agents.map(a => '<option ' + (MON_FILTERS.agent===a?'selected':'') + '>' + escapeHtml(a) + '</option>').join('') + '</select>' +
    'Stage: <select id="fltStage">' + stages.map(s => '<option ' + (MON_FILTERS.stage===s?'selected':'') + '>' + escapeHtml(s) + '</option>').join('') + '</select>' +
    'Level: <select id="fltLevel">' + levels.map(l => '<option ' + (MON_FILTERS.level===l?'selected':'') + '>' + escapeHtml(l) + '</option>').join('') + '</select>' +
    '</div>';
  html += '<div class="log-header"><div>Time</div><div>Stage</div><div>Actor</div><div>Type</div><div>Message</div><div>Trace</div></div>';
  html += '<div class="log-table">';
  const filtered = STATE.logs.filter(l => {
    if (MON_FILTERS.agent !== 'all' && l.actor !== MON_FILTERS.agent) return false;
    if (MON_FILTERS.stage !== 'all' && l.stage !== MON_FILTERS.stage) return false;
    if (MON_FILTERS.level !== 'all' && l.type !== MON_FILTERS.level) return false;
    return true;
  });
  filtered.forEach(l => {
    const rowCls = ['log-row',
      l.type==='ESCALATION'?'escalation':'',
      l.type==='GATE'?'gate':'',
      l.type==='WARN'?'warn':''].filter(Boolean).join(' ');
    html += '<div class="' + rowCls + '">' +
      '<div>' + escapeHtml(l.ts) + '</div>' +
      '<div>' + escapeHtml(l.stage) + '</div>' +
      '<div>' + escapeHtml(l.actor) + '</div>' +
      '<div>' + escapeHtml(l.type) + '</div>' +
      '<div>' + escapeHtml(l.msg) + '</div>' +
      '<div style="color:var(--muted);">' + escapeHtml(l.trace) + '</div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderObs() {
  // Agent run times per stage (illustrative)
  const stageTimes = { 'Plan & Analyse':45, 'Design':60, 'Build & Test':180, 'Synthesis':40, 'Release':70 };
  const maxT = 200;
  let bars = '';
  Object.entries(stageTimes).forEach(([k,v],i) => {
    const w = (v/maxT) * 380;
    bars += '<rect x="140" y="'+(20+i*30)+'" width="'+w+'" height="20" fill="var(--agent)"/>' +
            '<text x="130" y="'+(35+i*30)+'" text-anchor="end" font-size="12" fill="#333">'+k+'</text>' +
            '<text x="'+(150+w)+'" y="'+(35+i*30)+'" font-size="12" fill="#333">'+v+'s</text>';
  });
  const chart = '<svg class="chart-svg" viewBox="0 0 560 180">' + bars + '</svg>';

  const tokens = [
    { agent: 'Frame Agent', tokens: 4200, cost: 0.021 },
    { agent: 'Plan Agent', tokens: 5800, cost: 0.029 },
    { agent: 'Design Agent', tokens: 12400, cost: 0.062 },
    { agent: 'Coding Agent (Compose)', tokens: 21600, cost: 0.108 },
    { agent: 'Test Agent (Compose)', tokens: 8200, cost: 0.041 },
    { agent: 'Synthesis Agent', tokens: 16800, cost: 0.084 },
    { agent: 'Deployment Preparation Agent', tokens: 7400, cost: 0.037 }
  ];
  const maxTok = 22000;
  const tokRows = tokens.map(t =>
    '<div class="metric-row"><div class="metric-label">' + escapeHtml(t.agent) + '</div>' +
    '<div class="metric-bar"><div class="fill" style="width:' + ((t.tokens/maxTok)*100).toFixed(0) + '%"></div></div>' +
    '<div class="metric-val">' + t.tokens.toLocaleString() + ' · $' + t.cost.toFixed(3) + '</div></div>'
  ).join('');

  const passFail = { pass: STATE.logs.filter(l => l.msg.indexOf('PASS')>=0).length, fail: STATE.logs.filter(l => l.msg.indexOf('FAIL')>=0).length };

  return '<div class="obs-panel">' +
    '<div class="obs-section"><h4>Agent Run Time per Stage <span class="illustrative-badge">Illustrative</span></h4>' + chart + '</div>' +
    '<div class="obs-section"><h4>Tokens &amp; Cost per Agent <span class="illustrative-badge">Illustrative</span></h4>' + tokRows + '</div>' +
    '<div class="obs-section"><h4>Test Pass / Fail</h4>' +
      '<div style="font-size:14px;">PASS: <strong style="color:var(--ok);">' + passFail.pass + '</strong> · FAIL: <strong style="color:var(--err);">' + passFail.fail + '</strong></div>' +
    '</div>' +
  '</div>';
}

function renderEvidence() {
  const gates = TIMELINE.filter(t => t.gate);
  const evHtml = gates.map(g => {
    const done = STATE.step >= g.id;
    const cls = done ? 'gate-approved' : 'gate-pending';
    const evList = g.gate.evidence.map(e => '<li>'+escapeHtml(e)+'</li>').join('');
    return '<div class="evidence-item ' + cls + '">' +
      '<h5>' + escapeHtml(g.gate.title) + ' — ' + escapeHtml(g.stage) + '</h5>' +
      '<div class="meta">Persona: ' + escapeHtml(g.gate.persona) + ' · Status: ' + (done ? 'APPROVED' : 'PENDING') + '</div>' +
      '<ul style="font-size:12px;margin:4px 0 0 16px;">' + evList + '</ul>' +
      '<div style="font-size:12px;font-style:italic;color:var(--obs);margin-top:4px;">Rationale: ' + escapeHtml(g.gate.rationale) + '</div>' +
    '</div>';
  }).join('');
  return '<div class="obs-panel">' + evHtml + '</div>';
}

function wireMonitorEvents() {
  document.querySelectorAll('[data-mtab]').forEach(el => {
    el.onclick = () => { MON_TAB = el.dataset.mtab; renderAll(); };
  });
  const fa = document.getElementById('fltAgent');
  const fs = document.getElementById('fltStage');
  const fl = document.getElementById('fltLevel');
  if (fa) fa.onchange = () => { MON_FILTERS.agent = fa.value; renderAll(); };
  if (fs) fs.onchange = () => { MON_FILTERS.stage = fs.value; renderAll(); };
  if (fl) fl.onchange = () => { MON_FILTERS.level = fl.value; renderAll(); };
}

// ---------------------------------------------------------------------------
// AGENT PORTAL RENDERING
// ---------------------------------------------------------------------------
function renderPortal() {
  let roster = '<div class="agent-roster">';
  roster += '<div class="agent-harness">';
  AGENTS.filter(a => HARNESS_AGENTS.has(a)).forEach(a => {
    roster += renderAgentItem(a);
  });
  roster += '</div>';
  AGENTS.filter(a => !HARNESS_AGENTS.has(a)).forEach(a => {
    roster += renderAgentItem(a);
  });
  roster += '</div>';

  const trace = STATE.traces[STATE.activeAgent] || [];
  let traceHtml = '<div class="agent-trace">';
  traceHtml += '<h3 style="margin:0 0 10px 0;">' + escapeHtml(STATE.activeAgent) + ' — trace</h3>';
  if (!trace.length) traceHtml += '<div style="color:var(--muted);">No activity yet for this agent.</div>';
  trace.forEach((t, idx) => traceHtml += renderTraceBlock(t, idx));
  traceHtml += '</div>';

  return '<div class="agent-portal">' + roster + traceHtml + '</div>';
}

function renderAgentItem(a) {
  const status = STATE.agents[a] || 'idle';
  const active = STATE.activeAgent === a;
  return '<div class="agent-item ' + (active ? 'active' : '') + '" data-agent="' + a + '">' +
    '<span><span class="status-dot status-' + status + '"></span>' + escapeHtml(a) + '</span>' +
    '<span style="font-size:11px;color:var(--muted);">' + status + '</span>' +
    '</div>';
}

function renderTraceBlock(t, idx) {
  const kindEmoji = { thinking:'💭', 'tool-call':'🔧', 'tool-result':'📥', artefact:'📄', handover:'⛔' };
  const kindLabel = { thinking:'Thinking', 'tool-call':'Tool call', 'tool-result':'Tool result', artefact:'Artefact produced', handover:'Handover to human' };
  const emoji = kindEmoji[t.kind] || '·';
  const label = kindLabel[t.kind] || t.kind;
  let body = '';
  if (t.kind === 'thinking') body = '<div class="trace-body"><em>"' + escapeHtml(t.payload) + '"</em></div>';
  else if (t.kind === 'tool-call' || t.kind === 'tool-result') {
    body = '<div class="trace-body json" id="trBody-' + STATE.activeAgent.replace(/\W/g,'') + '-' + idx + '">' + escapeHtml(JSON.stringify(t.payload, null, 2)) + '</div>';
    if (t.extras && t.extras.footnote) {
      body += '<div class="footnote">Assuming Confluence is updated and CX knowledge is accessible, accurate, of high quality.</div>';
    }
  }
  else if (t.kind === 'artefact') body = '<div class="trace-body">→ <a href="#" onclick="event.preventDefault();STATE.activeApp=\'repo\';REPO_FILE=null;renderAll();">' + escapeHtml(t.payload.file) + '</a></div>';
  else if (t.kind === 'handover') body = '<div class="trace-body">Waiting on: <strong>' + escapeHtml((t.payload.to||[]).join(', ')) + '</strong>. Reason: ' + escapeHtml(t.payload.reason||'—') + '</div>';

  return '<div class="trace-block ' + t.kind + '">' +
    '<div class="trace-header" onclick="toggleTrace(this)">' + emoji + ' ' + label + ' <span style="margin-left:auto;color:var(--muted);font-size:11px;font-weight:400;">' + escapeHtml(t.ts) + '</span></div>' +
    body +
  '</div>';
}

function wirePortalEvents() {
  document.querySelectorAll('.agent-item').forEach(el => {
    el.onclick = () => { STATE.activeAgent = el.dataset.agent; renderAll(); };
  });
}

function toggleTrace(hdr) {
  const body = hdr.nextElementSibling;
  if (body && body.classList.contains('trace-body')) {
    body.classList.toggle('collapsed');
  }
}

// ---------------------------------------------------------------------------
// SUMMARY VIEW
// ---------------------------------------------------------------------------
function renderSummary() {
  const chainOrder = ['Intent.md','Spec.md','Dev_completion.md','Testing_report.md','Deployment_package.md','Sandbox_Pre_deploy_check.md'];
  const chain = chainOrder.map(name => {
    const f = STATE.files[name];
    if (!f) return '';
    const fm = extractFrontMatter(f.content);
    return '<div class="chain-node"><div class="name">' + escapeHtml(name) + '</div>' +
      '<div class="approver">' + escapeHtml(fm.approved_by || 'pending') + '</div>' +
      '<div class="hash">' + escapeHtml(fm.hash || '') + '</div></div>';
  }).join('<span class="chain-arrow">→</span>');

  return '<div style="overflow:auto;height:100%;">' +
    '<div class="summary-view">' +
    '<h2>Delivery Summary — CX-EPIC-214: Upgrade Bid</h2>' +
    '<div class="summary-metrics">' +
      '<div class="metric-card"><div class="val">~4.2 hrs</div><div class="lbl">Agent time <span class="illustrative-badge">Illustrative</span></div></div>' +
      '<div class="metric-card"><div class="val">~3 wks</div><div class="lbl">Typical human time</div></div>' +
      '<div class="metric-card"><div class="val">100%</div><div class="lbl">Steps logged</div></div>' +
      '<div class="metric-card"><div class="val">14</div><div class="lbl">Agent steps</div></div>' +
      '<div class="metric-card"><div class="val">4</div><div class="lbl">Deterministic steps</div></div>' +
      '<div class="metric-card"><div class="val">6</div><div class="lbl">Human gates</div></div>' +
      '<div class="metric-card"><div class="val">6</div><div class="lbl">Artefacts produced</div></div>' +
      '<div class="metric-card"><div class="val">0</div><div class="lbl">Unproven criteria at merge</div></div>' +
      '<div class="metric-card"><div class="val">87%</div><div class="lbl">Coverage (+4.2%)</div></div>' +
    '</div>' +
    '<h3>Evidence Chain</h3>' +
    '<div class="evidence-chain">' + chain + '</div>' +
    '<button class="summary-btn" onclick="resetAll()">↺ Replay</button>' +
    '<button class="summary-btn" onclick="scrollToChain()">Show Evidence Chain</button>' +
    '</div>' +
  '</div>';
}

function scrollToChain() {
  const el = document.querySelector('.evidence-chain');
  if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function extractFrontMatter(content) {
  const m = content.match(/^---\s*\n([\s\S]*?)\n---/);
  if (!m) return {};
  const fm = {};
  m[1].split('\n').forEach(line => {
    const kv = line.match(/^([\w_]+):\s*(.*)$/);
    if (kv) fm[kv[1].trim()] = kv[2].trim();
  });
  return fm;
}

// ============================================================================
// UTILITIES
// ============================================================================
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// WIRING TOP-LEVEL EVENTS
// ============================================================================
document.getElementById('btnNext').onclick = () => { pause(); advanceStep(); };
document.getElementById('btnReset').onclick = () => resetAll();
document.getElementById('personaSel').onchange = (e) => { STATE.persona = e.target.value; renderAll(); };

document.getElementById('tgTestFail').onclick = () => { STATE.toggles.testFail = !STATE.toggles.testFail; renderAll(); };
document.getElementById('tgLowRisk').onclick = () => { STATE.toggles.lowRisk = !STATE.toggles.lowRisk; renderAll(); };
document.getElementById('tgReject').onclick = () => {
  STATE.toggles.reject = !STATE.toggles.reject;
  // If rejecting the FDE step, wire the requestChanges into approve for auto-play
  const fde = TIMELINE.find(t => t.stage === 'FDE Review' && t.gate);
  if (fde && STATE.toggles.reject) {
    fde._autoReject = true;
  } else if (fde) {
    fde._autoReject = false;
  }
  renderAll();
};
document.getElementById('tgSynth').onclick = () => { STATE.toggles.synth = !STATE.toggles.synth; renderAll(); };

document.getElementById('btnFocus').onclick = () => { STATE.viewMode='focus'; renderAll(); };
document.getElementById('btnGrid').onclick = () => { STATE.viewMode='grid'; renderAll(); };

document.querySelectorAll('.app-tab').forEach(el => {
  el.onclick = () => { STATE.activeApp = el.dataset.app; renderAll(); };
});

document.getElementById('drawerToggle').onclick = () => {
  STATE.drawerOpen = !STATE.drawerOpen;
  const drawer = document.getElementById('drawer');
  const main = document.getElementById('mainArea');
  drawer.classList.toggle('collapsed', !STATE.drawerOpen);
  main.classList.toggle('drawer-collapsed', !STATE.drawerOpen);
};

window.closeModal = closeModal;
window.approveGate = approveGate;
window.requestChanges = requestChanges;
window.escalate = escalate;
window.resetAll = resetAll;
window.toggleTrace = toggleTrace;
window.scrollToChain = scrollToChain;
window.renderAll = renderAll;

// Approve at the gate, we treat it as "Request Changes" for the demo path.

// Initial render
initState();
renderAll();

</script>
